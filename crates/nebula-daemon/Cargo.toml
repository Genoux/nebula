[package]
name = "nebula-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nebula"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
nebula-core = { path = "../nebula-core" }
clap = { version = "4.6.6", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
nebula-audio = { path = "../nebula-audio" }
nebula-live = { path = "../nebula-live" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
serde_json = "1"
nebula-wake = { path = "../nebula-wake" }
libc = "0.2"
