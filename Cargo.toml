[workspace]
resolver = "3"
members = [
    "crates/nebula-core",
    "crates/nebula-audio",
    "crates/nebula-wake",
    "crates/nebula-live",
    "crates/nebula-daemon",
    "crates/nebula-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
